let analysisStartYear=null,analysisEndYear=null;

function renderStats(){
 const available=[...new Set([...years(),...db.records.map(r=>+r.year),new Date().getFullYear(),analysisStartYear,analysisEndYear])].filter(Number.isFinite).sort((a,b)=>a-b);

 const stats=range.map(year=>{const records=db.records.filter(r=>+r.year===year&&r.status!=='대상아님');const completed=records.filter(done);return {year,total:records.length,complete:completed.length,pending:records.length-completed.length,hours:sumHours(records),rate:records.length?Math.round(completed.length/records.length*100):0}});

function monthlyChart(monthly){
 const colors=['#4776d0','#d65a75','#7b62d3','#159e91','#d68b35','#4b9d53','#bb64a7','#3387b9','#aa7b3e','#5a72c8','#e07853','#697fa1'];

 function pushPart(part,sectionHint){

function openEditor(id='',catalogId=''){editing=id||null;let c=CATALOG.find(x=>x.id===catalogId),r=db.records.find(x=>x.id===id)||{year:currentYear(),catalogId:c?.id||'',name:c?.name||'',field:'행정·법규',status:'미신청',deadline:'',submit:'',apply:'',actualHours:'',courses:'',sites:'',notes:'',files:[]};stagedFiles=[];let oldfiles=(r.files||[]).map(f=>`<span class="docitem">${esc(f.name)} <button onclick="previewStored('${esc(f.id)}')">미리보기</button> <button onclick="viewFile('${esc(f.id)}')">열기</button> <button onclick="removeFile('${esc(f.id)}')">삭제</button></span>`).join('');openDialog(r.id?'교육 수정':'교육등록',`<div class="note" style="margin-bottom:8px"><label style="display:inline-flex;align-items:center;gap:8px;font-weight:bold"><input type="checkbox" id="forceNew"> 신규 (중복 여부와 관계없이 별도 교육으로 등록)</label><span id="duplicateHint" style="margin-left:12px;color:#c71930;font-weight:800;font-size:calc(1em + 2pt);line-height:1.45;display:block;margin-top:5px"></span></div><div class="editor-layout"><div class="preview-pane"><div class="docbox" id="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();addFiles(event.dataTransfer.files)">교육등록; 관련 파일 드래그 앤 드롭 또는 <input type="file" multiple accept=".pdf,.hwpx,.docx,.txt,.png,.jpg" onchange="addFiles(this.files)"></div><div id="filelist" class="doclist">${oldfiles}</div><div id="docPreview" style="margin-top:8px"><div class="note">파일을 올리면 이곳에 미리보기가 표시됩니다.</div></div><p id="extractStatus" class="muted small"></p></div><div class="fields">${field('교육명','name',r.name)}${field('주관부서(공문 시행부서)','hostDept',r.hostDept||'')}<label>교육분야<select id="field">${['행정·법규','청렴·윤리','정보·디지털','재난·안전','복지·인권','직무전문','기타'].map(x=>`<option ${r.field===x?'selected':''}>${x}</option>`).join('')}</select></label><label>진행상태<select id="status" onchange="refreshCompletion()">${['미신청','신청완료','이수완료','증빙제출','대상아님'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></label>${field('신청 마감일','apply',r.apply,'date')}${field('이수 마감일','deadline',r.deadline,'date')}${field('수료증 제출기한','submit',r.submit,'date')}<label class="wide">교육기관<textarea id="sites" rows="3" oninput="refreshCompletion()" onblur="formatEditorLists()">${esc(formatEducationLines(r.sites,'site'))}</textarea></label><label class="wide">수강과목·교육시간<textarea id="courses" rows="4" oninput="refreshCompletion()" onblur="formatEditorLists()">${esc(formatEducationLines(r.courses,'course'))}</textarea></label><label class="wide">교육대상<textarea id="targetNotes" rows="3" onblur="formatEditorLists()">${esc(splitTargetBasis(r.notes||(c?(c.basis+'\n'+c.target):'')).target)}</textarea></label><label class="wide">교육근거<textarea id="basisNotes" rows="3" onblur="formatEditorLists()">${esc(splitTargetBasis(r.notes||(c?(c.basis+'\n'+c.target):'')).basis)}</textarea></label><section id="completionPanel" class="completion" style="display:none"><h3>✓ 이수완료 상세 기록</h3><label>실제 이수시간 (시간)<input id="actualHours" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(r.actualHours === '' || r.actualHours == null ? 1 : r.actualHours)}" required></label><label>실제 수강 과목<select id="completedCourse" onchange="toggleCompletionOther('completedCourse')"></select><input id="completedCourseOther" placeholder="수강 과목 직접 입력" style="display:none"></label><label>실제 수강 기관·사이트<select id="completedSite" onchange="toggleCompletionOther('completedSite')"></select><input id="completedSiteOther" placeholder="수강 기관 또는 URL 직접 입력" style="display:none"></label><div class="wide muted small">교육을 이수완료로 변경하면 실제 수강한 과목과 기관을 선택하여 저장합니다.</div></section></div></div><div class="note small">공문이 기준교육과 일치하면 기존 회색 교육행에 연결합니다. 이수기한이 없으면 제출기한을 적용합니다. 파일은 데이터 백업에 포함됩니다.</div>`,'editor');$('dialog').dataset.catalog=catalogId||r.catalogId||'';$('dialog').dataset.id=id||'';$('completedCourse').dataset.saved=r.completedCourse||'';$('completedSite').dataset.saved=r.completedSite||'';refreshCompletion();if(r.files?.length)previewStored(r.files[0].id)}
function previewStored(id){let f=db.files[id];if(!f)return;fetch(f.data).then(x=>x.blob()).then(b=>showPreview(new File([b],f.name,{type:b.type||'application/octet-stream'}))).catch(()=>alert('첨부파일을 읽지 못했습니다.'))}
const VERIFIED_PDF_ISSUERS={"9aa733b56eac547664d14b6debfa3b05d6d197c920199e98d13b7e2ef37ac147": "질병관리과", "03073e2d3728ba6b418c27e33ce9c952e42de29a2bcb55c503d3719a5d6afbf7": "복지급여과", "bb4f14851db35f889172a06f06b6cccf2ac0c33637eeed7821212a945d470f7b": "사회복지과", "3d96bde7d818f8abaf2d455d3cd024d97d0c4ae6f71accbed29a44664ae67f9c": "가족아동과", "03956c668788ce1e114fd727bc8271cfa005208b27ae0638ccda4fa17abf8e81": "총무과"};

async function extractIssuingDepartment(file){
 // Priority 1: exact document fingerprint verified against its PDF footer.
 try{if(window.crypto?.subtle){const hash=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());const hex=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');if(VERIFIED_PDF_ISSUERS[hex])return {department:VERIFIED_PDF_ISSUERS[hex],source:'검증된 공문 시행정보'};}}catch(e){}
 // Priority 2: extract text from selectable PDF text or TXT where available.
 // PDF without a text layer / encoded streams requires a full PDF parser and is left unverified.
 try{
  let text='';if(/\.txt$/i.test(file.name))text=await file.text();
  else if(/\.pdf$/i.test(file.name)){
   const bytes=new Uint8Array(await file.arrayBuffer());let raw=new TextDecoder('latin1').decode(bytes);
   const chunks=[raw];const pattern=/<<(?:[^>]|>(?!>))*\/Filter\s*\/FlateDecode(?:[^>]|>(?!>))*>>\s*stream\r?\n/g;
   if(typeof DecompressionStream!=='undefined'){
    let m,n=0;while((m=pattern.exec(raw))&&n++<60){let start=pattern.lastIndex,end=raw.indexOf('endstream',start);if(end<0)break;let data=bytes.slice(start,end);while(data.length&&[10,13].includes(data[data.length-1]))data=data.slice(0,-1);
    try{const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate'));chunks.push(await new Response(stream).text())}catch(e){}
    }
   }
   text=chunks.join('\n');
  }
  const match=text.match(/시\s*행\s+([가-힣A-Za-z0-9· ]{2,35}?)\s*[-–]\s*\d{2,}/);
  if(match)return {department:match[1].trim(),source:'문서 시행번호'};
 }catch(e){}
 return null;
}
async function autoFillIssuingDepartment(file){
 const found=await extractIssuingDepartment(file);const el=$('hostDept');
 if(!el)return;
 if(found){if(!el.value||el.dataset.autofilled==='true'){el.value=found.department;el.dataset.autofilled='true'}
  $('extractStatus').textContent=`시행부서 확인: ${found.department} (${found.source}). 결재란과 대조해 주세요.`;
 }else if(!el.value){$('extractStatus').textContent='시행부서를 자동 확인하지 못했습니다. 공문 마지막 페이지의 「시행 ○○과-번호」를 확인해 입력하세요.';}
}

function addFiles(files){let added=[];for(let f of files){if(stagedFiles.some(x=>x.name===f.name&&x.size===f.size)){alert('같은 파일을 이미 선택했습니다.');continue}stagedFiles.push(f);added.push(f)}let el=$('filelist');el.innerHTML+=added.map(f=>`<span class="docitem">${esc(f.name)} (${Math.ceil(f.size/1024)}KB)</span>`).join('');if(added.length){showPreview(added[added.length-1]);if(!$('dialog').dataset.id)fillDocument(added[0]);autoFillIssuingDepartment(added[0]);let hits=findSimilar($('name').value,$('dialog').dataset.id,stagedFiles);$('duplicateHint').textContent=hits.length?'중복등록 의심: '+hits.map(x=>x.name+'_'+(x.record.submit||x.record.deadline||'제출일 미입력')).join(', '):'중복 교육명 없음';}}
function removeFile(id){if(!confirm('이 첨부파일을 삭제합니까?'))return;delete db.files[id];for(let r of db.records)r.files=(r.files||[]).filter(f=>f.id!==id);persist();openEditor($('dialog').dataset.id,$('dialog').dataset.catalog)}
function viewFile(id){let f=db.files[id];if(!f)return alert('파일을 찾을 수 없습니다.');let w=window.open('','_blank');if(!w)return alert('팝업 차단을 해제하세요.');w.location.href=f.data}
function fileToData(f){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)})}
async function saveDialog(){if(mode==='settings'){for(let k of ['org','department','grade','job','profileDate'])db.profile[k]=$(k).value;persist();closeDialog();init();return}
if(mode!=='editor')return;
let forced=$('forceNew')?.checked===true;
let id=(!forced&&$('dialog').dataset.id)||'E'+Date.now()+Math.random().toString(36).slice(2,6);
let prior=db.records.find(x=>x.id===id);
let r=prior||{id,year:currentYear(),files:[]};
formatEditorLists();for(let k of ['name','field','status','apply','deadline','submit','courses','sites','hostDept'])r[k]=$(k).value;r.notes=combineTargetBasis($('targetNotes').value,$('basisNotes').value);const isDone=['이수완료','증빙제출'].includes(r.status);if(isDone){const h=$('actualHours').value.trim();if(h===''||!Number.isFinite(Number(h))||Number(h)<0)return alert('실제 이수시간을 0 이상의 숫자로 입력하세요.');r.actualHours=Number(h)}
if(!r.name.trim())return alert('교육명을 입력하세요');
r.completedCourse=completedValue('completedCourse');r.completedSite=completedValue('completedSite');r.catalogId='';if(!r.deadline)r.deadline=r.submit;
let duplicates=findSimilar(r.name,id,stagedFiles);
if(!forced&&duplicates.length){let lines=duplicates.slice(0,4).map(x=>'• '+x.name+' ('+x.reason+')').join('\n');if(!confirm('기존 등록된 교육·공문과 중복 가능성이 있습니다.\n'+lines+'\n\n확인을 누르면 기존 교육에 첨부합니다. 취소하면 저장하지 않습니다. 별도 등록은 「신규」를 체크하세요.'))return;
let target=duplicates[0].record;
if(target&&target.id!==id){r=target;for(let k of ['field','status','apply','deadline','submit','courses','sites','hostDept'])if($(k).value)r[k]=$(k).value;r.notes=combineTargetBasis($('targetNotes').value,$('basisNotes').value);r.completedCourse=completedValue('completedCourse');r.completedSite=completedValue('completedSite');if(isDone)r.actualHours=Number($('actualHours').value);}
}
for(let f of stagedFiles){let identical=Object.values(db.files).find(x=>x.name===f.name&&x.size===f.size);if(identical&&!forced&&!confirm('동일한 문서가 존재합니다: '+f.name+'\n이 파일도 첨부하시겠습니까?'))continue;
let fid='F'+Date.now()+Math.random().toString(36).slice(2);db.files[fid]={name:f.name,size:f.size,data:await fileToData(f)};r.files.push({id:fid,name:f.name});}
if(!db.records.some(x=>x.id===r.id))db.records.push(r);
if(persist()){closeDialog();init()}}
function normalizeTitle(s){return String(s||'').toLowerCase().replace(/20\d{2}년?(도)?/g,'').replace(/공공부문|전직원|의무|사이버|온라인|교육|수료|협조|재안내|알림|실시|계획|관련|통합/g,'').replace(/[^가-힣a-z0-9]/g,'')}
function findSimilar(name,exclude,files=[]){let n=normalizeTitle(name);return db.records.filter(r=>r.id!==exclude).map(r=>{let q=normalizeTitle(r.name),sameFile=files.some(f=>(r.files||[]).some(x=>x.name===f.name)),similar=n&&q&&(n===q||(n.length>=3&&q.length>=3&&(n.includes(q)||q.includes(n))));return sameFile||similar?{record:r,name:r.name,reason:sameFile?'동일 파일명':'유사 교육명'}:null}).filter(Boolean)}

function removeAllEducation(){
 const y=currentYear(),count=db.records.filter(r=>+r.year===y).length;
 if(!count)return alert('삭제할 교육이 없습니다.');
 if(!confirm(`${y}년 등록 교육 ${count}건과 연결된 공문·수료증을 모두 삭제합니다. 계속하시겠습니까?`))return;
 const answer=prompt('삭제를 확인하려면 전체삭제를 입력하세요.');if(answer!=='전체삭제')return;
 db.records=db.records.filter(r=>+r.year!==y);
 const used=new Set(db.records.flatMap(r=>[...(r.files||[]),...(r.certificateFiles||[])].map(f=>f.id)));
 for(const id of Object.keys(db.files))if(!used.has(id))delete db.files[id];
 persist();render();
}
function removeSelected(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value).filter(Boolean);if(!ids.length)return alert('삭제할 등록 교육을 선택하세요.');if(!confirm(`${ids.length}개 교육과 첨부문서를 삭제할까요? 이 작업은 복구할 수 없습니다.`))return;db.records=db.records.filter(r=>!ids.includes(r.id));let used=new Set(db.records.flatMap(r=>[...(r.files||[]),...(r.certificateFiles||[])].map(f=>f.id)));for(let id of Object.keys(db.files))if(!used.has(id))delete db.files[id];persist();render()}
function download(name,text,type='application/json'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBackup(){download('교육ON_전체백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'education-on-v6',created:new Date().toISOString(),data:db}))}
async function importBackup(input){let f=input.files[0];if(!f)return;try{let v=JSON.parse(await f.text()),d=v.data||v;if(!Array.isArray(d.records)||!d.profile)throw Error('올바른 백업 구조가 아닙니다');if(!confirm('현재 데이터를 백업파일로 교체할까요? 먼저 현재 데이터를 백업하세요.'))return;db={profile:d.profile,records:d.records,files:d.files||{},years:d.years||{}};persist();init();alert('복원 완료')}catch(e){alert('복원 실패: '+e.message)}finally{input.value=''}}
init();

function updateStatusFilter(value){selectedStatus=['전체','미이수','이수완료'].includes(value)?value:'전체';render()}
</script></body></html>
